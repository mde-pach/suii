# Sort open issues into groups by dragging them under a heading.
title: "Weekly triage: {{ data.issues | size }} open issues"
intro: Drag each issue under the group it belongs to, then tick **Apply**. The workflow receives the groups and can label or close the issues.
fields:
  - id: triage
    type: buckets
    label: Issues
    buckets:
      - { id: this-week, label: This week }
      - { id: backlog, label: Backlog }
      - { id: close, label: Close }
    options:
      from: data.issues
      label: "{{ item.title }} {{ item.number | prepend: '#' | code }}"
      value: "{{ item.number }}"
      bucket: backlog
submit: Apply
