# Publishes a release: checks the build, tags vX.Y.Z, moves the vX tag, and creates the GitHub release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v (e.g. 1.0.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3 (got '$VERSION')"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION already exists"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist/ is up to date
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date; run 'npm run build' and commit it before releasing."
            exit 1
          fi

      - name: Tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          MAJOR="v${VERSION%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "suii v$VERSION"
          git tag -f -a "$MAJOR" -m "suii $MAJOR (points to v$VERSION)"
          git push origin "v$VERSION"
          git push -f origin "$MAJOR"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "suii v$VERSION" \
            --generate-notes \
            --latest \
            --notes "Use it with \`uses: ${GITHUB_REPOSITORY}@v${VERSION%%.*}\` (or pin \`@v$VERSION\`). Documentation: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
